<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
  <title id="title">Journey to Be the Great Mage Style Guide: UI Components</title>
  <desc id="desc">A4 portrait style-guide page showing the rune plane, green fingertip cursor, caption above book states, and separated control panel.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2a1411"/><stop offset="1" stop-color="#0d080c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .display { font-family: Cinzel, Georgia, serif; }
      .ui { font-family: Inter, Arial, sans-serif; }
      .section { font: 700 12px Inter, Arial, sans-serif; letter-spacing: 2px; fill: #e8c76a; }
      .body { font: 400 14px Inter, Arial, sans-serif; fill: #b9ae9d; }
      .small { font: 400 11px Inter, Arial, sans-serif; fill: #b9ae9d; }
    </style>
  </defs>
  <rect width="794" height="1123" fill="#0b0a10"/>
  <text x="56" y="84" class="display" font-size="38" font-weight="700" fill="#f3e6c8">Journey to Be the Great Mage</text>
  <text x="58" y="112" class="ui" font-size="12" letter-spacing="3" fill="#e8c76a">STYLE GUIDE / UI COMPONENTS</text>
  <line x1="56" y1="140" x2="738" y2="140" stroke="#e8c76a" stroke-opacity=".4"/>
  <text x="56" y="192" class="section">03 / SPATIAL UI COMPOSITION</text>
  <text x="56" y="218" class="body">The active rune stays above the book. Captions lead into the book, while controls sit lower.</text>

  <!-- Large rune plane and distinct fingertip marker. -->
  <g transform="translate(56 255)">
    <rect width="350" height="240" rx="28" fill="#111320" stroke="#9bb7ff" stroke-width="3"/>
    <path d="M175 47 276 182H74Z" fill="none" stroke="#e8c76a" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="175" cy="47" r="13" fill="#5dff9a"/>
    <text x="0" y="270" class="small">Rune plane: large, high contrast, upper field</text>
  </g>
  <g transform="translate(470 278)">
    <text x="0" y="0" class="section">FINGERTIP CURSOR</text>
    <circle cx="62" cy="78" r="40" fill="#ffe9a0" opacity=".18"/>
    <circle cx="62" cy="78" r="26" fill="none" stroke="#ffe9a0" stroke-width="7"/>
    <circle cx="62" cy="78" r="12" fill="#e8c76a"/>
    <circle cx="57" cy="73" r="5" fill="#fff8e0"/>
    <circle cx="170" cy="78" r="40" fill="#5dff9a" opacity=".18"/>
    <circle cx="170" cy="78" r="26" fill="none" stroke="#5dff9a" stroke-width="7"/>
    <circle cx="170" cy="78" r="12" fill="#5dff9a"/>
    <circle cx="165" cy="73" r="5" fill="#fff8e0"/>
    <text x="62" y="132" text-anchor="middle" class="small">Idle</text>
    <text x="170" y="132" text-anchor="middle" class="small">Pinch detected</text>
    <text x="0" y="166" class="body">Yellow: hand visible and ready.</text>
    <text x="0" y="188" class="body">Green: pinch begins drawing.</text>
    <text x="0" y="215" class="small">Rose remains reserved for off-path feedback.</text>
  </g>

  <!-- Caption and hint stay directly above the book. -->
  <g transform="translate(56 545)">
    <text x="0" y="0" class="section">CAPTION + HINT</text>
    <rect y="20" width="682" height="74" rx="18" fill="#08060e" fill-opacity=".86" stroke="#fff" stroke-opacity=".1"/>
    <text x="341" y="51" text-anchor="middle" class="ui" font-size="14" fill="#f3e6c8">Trace the Ignite rune.</text>
    <text x="341" y="72" text-anchor="middle" class="ui" font-size="14" fill="#f3e6c8">Match its shape in your own way.</text>
    <rect x="170" y="112" width="342" height="54" rx="14" fill="url(#panel)" stroke="#e8c76a" stroke-opacity=".55"/>
    <text x="341" y="145" text-anchor="middle" class="ui" font-size="13" fill="#f3e6c8">Pinch to draw · open hand to finish</text>
  </g>

  <!-- Actual cover SVG paired with the opened spellbook state. -->
  <g transform="translate(56 735)">
    <rect width="682" height="238" rx="20" fill="#17121a" stroke="#e8c76a" stroke-opacity=".25"/>
    <image href="spellbook-closed.svg" x="84" y="17" width="108" height="181" preserveAspectRatio="xMidYMid meet"/>
    <path d="M198 107h24" stroke="#e8c76a" stroke-width="3" stroke-linecap="round"/>
    <path d="m212 98 10 9-10 9" fill="none" stroke="#e8c76a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(242 18)" filter="url(#shadow)">
      <path d="M0 34Q76 1 160 25v166Q78 165 0 202Z" fill="#f3e6c8" stroke="#e8c76a" stroke-width="4"/>
      <path d="M160 25Q244 1 320 34v168q-82-37-160-11Z" fill="#f3e6c8" stroke="#e8c76a" stroke-width="4"/>
      <path d="M160 25v166" stroke="#8f6a38" stroke-width="5"/>
      <path d="M28 70h88M28 96h96M28 122h73M193 70h90M193 96h94M193 122h76" stroke="#8f6a38" stroke-width="5" stroke-linecap="round" opacity=".74"/>
      <path d="m240 150 18-31 18 31-18 31Z" fill="none" stroke="#ff6b2c" stroke-width="5"/>
    </g>
    <text x="138" y="220" text-anchor="middle" class="small">Actual cover SVG</text>
    <text x="402" y="220" text-anchor="middle" class="small">Opened spellbook</text>
  </g>

  <text x="56" y="1016" class="section">SPATIAL RULE</text>
  <text x="56" y="1044" class="body">Captions lead into the centered book states. Controls appear separately on page 4.</text>
  <text x="56" y="1072" class="small">The opened spread mirrors the live canvas layout used in the prototype.</text>
</svg>
