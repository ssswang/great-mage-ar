<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
  <title id="title">Journey To Be A Great Mage Style Guide: UI Components</title>
  <desc id="desc">A4 portrait style-guide page showing the rune plane, green fingertip cursor, caption above book states, and separated control plaque.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2a1411"/><stop offset="1" stop-color="#0d080c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .display { font-family: Cinzel, Georgia, serif; }
      .ui { font-family: Inter, Arial, sans-serif; }
      .section { font: 700 12px Inter, Arial, sans-serif; letter-spacing: 2px; fill: #e8c76a; }
      .body { font: 400 14px Inter, Arial, sans-serif; fill: #b9ae9d; }
      .small { font: 400 11px Inter, Arial, sans-serif; fill: #b9ae9d; }
    </style>
  </defs>
  <rect width="794" height="1123" fill="#0b0a10"/>
  <text x="56" y="84" class="display" font-size="38" font-weight="700" fill="#f3e6c8">Journey To Be A Great Mage</text>
  <text x="58" y="112" class="ui" font-size="12" letter-spacing="3" fill="#e8c76a">STYLE GUIDE / UI COMPONENTS</text>
  <line x1="56" y1="140" x2="738" y2="140" stroke="#e8c76a" stroke-opacity=".4"/>
  <text x="56" y="192" class="section">03 / SPATIAL UI COMPOSITION</text>
  <text x="56" y="218" class="body">The active rune stays above the book. Captions lead into the book, while controls sit lower.</text>

  <!-- Large rune plane and distinct fingertip marker. -->
  <g transform="translate(56 255)">
    <rect width="350" height="240" rx="28" fill="#111320" stroke="#9bb7ff" stroke-width="3"/>
    <path d="M175 47 276 182H74Z" fill="none" stroke="#e8c76a" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="175" cy="47" r="13" fill="#5dff9a"/>
    <text x="0" y="270" class="small">Rune plane: large, high contrast, upper field</text>
  </g>
  <g transform="translate(470 278)">
    <text x="0" y="0" class="section">FINGERTIP CURSOR</text>
    <circle cx="96" cy="78" r="46" fill="#5dff9a" opacity=".18"/>
    <circle cx="96" cy="78" r="28" fill="none" stroke="#5dff9a" stroke-width="7"/>
    <circle cx="96" cy="78" r="13" fill="#ffe9a0"/>
    <circle cx="91" cy="73" r="5" fill="#fff8e0"/>
    <text x="0" y="145" class="body">Green ring and yellow core</text>
    <text x="0" y="167" class="body">confirm the tracked fingertip.</text>
    <text x="0" y="205" class="small">Never reuse green or yellow for errors.</text>
  </g>

  <!-- Caption and hint stay directly above the book. -->
  <g transform="translate(56 545)">
    <text x="0" y="0" class="section">CAPTION + HINT</text>
    <rect y="20" width="682" height="74" rx="18" fill="#08060e" fill-opacity=".86" stroke="#fff" stroke-opacity=".1"/>
    <text x="341" y="51" text-anchor="middle" class="ui" font-size="14" fill="#f3e6c8">Trace the Ignite rune.</text>
    <text x="341" y="72" text-anchor="middle" class="ui" font-size="14" fill="#f3e6c8">Match its shape in your own way.</text>
    <rect x="170" y="112" width="342" height="54" rx="14" fill="url(#panel)" stroke="#e8c76a" stroke-opacity=".55"/>
    <text x="341" y="145" text-anchor="middle" class="ui" font-size="13" fill="#f3e6c8">Pinch to draw · open hand to finish</text>
  </g>

  <!-- Closed and opened world-anchored spellbook states. -->
  <g transform="translate(56 735)">
    <rect width="350" height="220" rx="20" fill="#17121a" stroke="#e8c76a" stroke-opacity=".25"/>
    <image href="spellbook-closed.svg" x="25" y="22" width="92" height="154" preserveAspectRatio="xMidYMid meet"/>
    <path d="M127 99h15" stroke="#e8c76a" stroke-width="3" stroke-linecap="round"/>
    <path d="m137 91 9 8-9 8" fill="none" stroke="#e8c76a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(155 32)" filter="url(#shadow)">
      <path d="M0 21Q37 2 79 17v121Q38 123 0 143Z" fill="#f3e6c8" stroke="#e8c76a" stroke-width="3"/>
      <path d="M79 17Q121 2 158 21v122q-38-20-79-5Z" fill="#f3e6c8" stroke="#e8c76a" stroke-width="3"/>
      <path d="M79 17v121" stroke="#8f6a38" stroke-width="4"/>
      <path d="M17 51h43M17 68h48M17 85h38M97 51h43M97 68h47M97 85h35" stroke="#8f6a38" stroke-width="4" stroke-linecap="round" opacity=".78"/>
      <path d="m111 103 13-22 13 22-13 22Z" fill="none" stroke="#ff6b2c" stroke-width="4"/>
    </g>
    <text x="70" y="191" text-anchor="middle" class="small">Closed</text>
    <text x="234" y="191" text-anchor="middle" class="small">Opened spellbook</text>
  </g>

  <!-- Control plaque deliberately lower and separate from instructional text. -->
  <g transform="translate(432 775) skewX(-5)" filter="url(#shadow)">
    <rect width="306" height="90" rx="20" fill="url(#panel)" stroke="#e8c76a" stroke-opacity=".65"/>
    <rect x="12" y="15" width="132" height="60" rx="30" fill="#332019" stroke="#e8c76a"/>
    <rect x="162" y="15" width="132" height="60" rx="30" fill="#332019" stroke="#e8c76a"/>
    <text x="78" y="52" text-anchor="middle" class="ui" font-size="15" fill="#f3e6c8">Mic: Off</text>
    <text x="228" y="52" text-anchor="middle" class="ui" font-size="15" fill="#ffe9a0">Audio: On</text>
  </g>
  <text x="432" y="890" class="small">Controls remain clear of instructions.</text>

  <text x="56" y="992" class="section">SPATIAL RULE</text>
  <text x="56" y="1020" class="body">Captions lead into the book. Persistent controls remain lower and visually separate.</text>
  <text x="56" y="1050" class="small">The interaction-feedback example and gesture rules continue on page 3.</text>
  <text x="56" y="1092" class="small">Page 2 of 3 · Journey To Be A Great Mage mid-fidelity demo</text>
</svg>
