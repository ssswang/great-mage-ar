<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
  <title id="title">Journey to Be the Great Mage Style Guide: Foundations</title>
  <desc id="desc">A4 portrait style-guide page showing the Journey to Be the Great Mage colour palette and typography.</desc>
  <defs>
    <style>
      .display { font-family: Cinzel, Georgia, serif; }
      .ui { font-family: Inter, Arial, sans-serif; }
      .section { font: 700 12px Inter, Arial, sans-serif; letter-spacing: 2px; fill: #e8c76a; }
      .body { font: 400 14px Inter, Arial, sans-serif; fill: #b9ae9d; }
      .label { font: 600 15px Inter, Arial, sans-serif; fill: #f3e6c8; }
      .small { font: 400 11px Inter, Arial, sans-serif; fill: #b9ae9d; }
    </style>
  </defs>
  <rect width="794" height="1123" fill="#0b0a10"/>
  <circle cx="720" cy="35" r="230" fill="#ff6b2c" opacity=".04"/>
  <text x="56" y="84" class="display" font-size="38" font-weight="700" fill="#f3e6c8">Journey to Be the Great Mage</text>
  <text x="58" y="112" class="ui" font-size="12" letter-spacing="3" fill="#e8c76a">STYLE GUIDE / FOUNDATIONS</text>
  <line x1="56" y1="140" x2="738" y2="140" stroke="#e8c76a" stroke-opacity=".4"/>

  <text x="56" y="192" class="section">01 / COLOUR SYSTEM</text>
  <text x="56" y="218" class="body">Warm magic accents sit on a dark camera field. Blue guides; green confirms; rose signals error.</text>

  <g transform="translate(56 254)">
    <g><rect width="208" height="94" rx="14" fill="#0b0a10" stroke="#f3e6c8" stroke-opacity=".32"/><text x="15" y="31" class="label">Night ink</text><text x="15" y="57" class="small">#0B0A10 · camera field</text></g>
    <g transform="translate(236)"><rect width="208" height="94" rx="14" fill="#f3e6c8"/><text x="15" y="31" class="label" style="fill:#3a2414">Parchment</text><text x="15" y="57" class="small" style="fill:#3a2414">#F3E6C8 · readable text</text></g>
    <g transform="translate(0 116)"><rect width="208" height="94" rx="14" fill="#e8c76a"/><text x="15" y="31" class="label" style="fill:#1a120b">Gold</text><text x="15" y="57" class="small" style="fill:#3a2414">#E8C76A · active UI</text></g>
    <g transform="translate(236 116)"><rect width="208" height="94" rx="14" fill="#ff6b2c"/><text x="15" y="31" class="label">Ember</text><text x="15" y="57" class="small" style="fill:#f3e6c8">#FF6B2C · primary action</text></g>
    <g transform="translate(0 232)"><rect width="208" height="94" rx="14" fill="#9bb7ff"/><text x="15" y="31" class="label" style="fill:#1a120b">Guide blue</text><text x="15" y="57" class="small" style="fill:#1a120b">#9BB7FF · ghost rune</text></g>
    <g transform="translate(236 232)"><rect width="208" height="94" rx="14" fill="#5dff9a"/><text x="15" y="31" class="label" style="fill:#1a120b">Success green</text><text x="15" y="57" class="small" style="fill:#1a120b">#5DFF9A · success/start</text></g>
    <g transform="translate(118 348)"><rect width="208" height="94" rx="14" fill="#ff5d6c"/><text x="15" y="31" class="label">Error rose</text><text x="15" y="57" class="small" style="fill:#1a120b">#FF5D6C · off-path state</text></g>
  </g>

  <text x="56" y="764" class="section">02 / TYPOGRAPHY</text>
  <rect x="56" y="790" width="682" height="112" rx="18" fill="#17121a" stroke="#e8c76a" stroke-opacity=".24"/>
  <text x="80" y="821" class="small">DISPLAY / CINZEL, GEORGIA, SERIF</text>
  <text x="80" y="873" class="display" font-size="35" font-weight="700" fill="#f3e6c8">FLAME SIGIL</text>
  <text x="80" y="931" class="small">Use for spell names, title moments, and ceremonial hierarchy.</text>

  <rect x="56" y="955" width="682" height="112" rx="18" fill="#17121a" stroke="#e8c76a" stroke-opacity=".24"/>
  <text x="80" y="986" class="small">UI / INTER, SYSTEM UI, SANS-SERIF</text>
  <text x="80" y="1028" class="ui" font-size="30" font-weight="600" fill="#f3e6c8">Trace the rune in your own way.</text>
  <text x="80" y="1060" class="small">Captions 30-36 px · hints 24-26 px · panel text 17-72 px</text>
</svg>
