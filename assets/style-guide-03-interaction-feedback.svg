<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
  <title id="title">Journey To Be A Great Mage Style Guide: Interaction Feedback</title>
  <desc id="desc">A4 portrait interaction-feedback example showing a green fingertip circle, a blue dashed guide path, and a gold traced spell path above an opened spellbook.</desc>
  <defs>
    <clipPath id="sceneClip"><rect width="682" height="632" rx="28"/></clipPath>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b0a10" stop-opacity=".12"/><stop offset="1" stop-color="#0b0a10" stop-opacity=".78"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2a1411"/><stop offset="1" stop-color="#0d080c"/></linearGradient>
    <filter id="goldGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .display { font-family: Cinzel, Georgia, serif; }
      .ui { font-family: Inter, Arial, sans-serif; }
      .section { font: 700 12px Inter, Arial, sans-serif; letter-spacing: 2px; fill: #e8c76a; }
      .body { font: 400 14px Inter, Arial, sans-serif; fill: #d8cfbf; }
      .small { font: 400 11px Inter, Arial, sans-serif; fill: #b9ae9d; }
    </style>
  </defs>
  <rect width="794" height="1123" fill="#0b0a10"/>
  <text x="56" y="84" class="display" font-size="38" font-weight="700" fill="#f3e6c8">Journey To Be A Great Mage</text>
  <text x="58" y="112" class="ui" font-size="12" letter-spacing="3" fill="#e8c76a">STYLE GUIDE / INTERACTION FEEDBACK</text>
  <line x1="56" y1="140" x2="738" y2="140" stroke="#e8c76a" stroke-opacity=".4"/>
  <text x="56" y="192" class="section">04 / TRACE FEEDBACK IN CONTEXT</text>
  <text x="56" y="218" class="body">Keep each signal visually distinct: guide path, live trace, and tracked fingertip.</text>

  <g transform="translate(56 255)">
    <rect width="682" height="632" rx="28" fill="#16131a" stroke="#e8c76a" stroke-opacity=".42"/>
    <image href="living-room.jpg" width="682" height="632" preserveAspectRatio="xMidYMid slice" opacity=".73" clip-path="url(#sceneClip)"/>
    <rect width="682" height="632" rx="28" fill="url(#veil)"/>

    <!-- Predicted / target portion of the rune: always blue and dashed. -->
    <path d="M112 500 C162 425 196 345 258 264 S340 171 414 137" fill="none" stroke="#9bb7ff" stroke-width="12" stroke-linecap="round" stroke-dasharray="20 22" opacity=".92" filter="url(#softGlow)"/>
    <!-- User's completed trace: warm gold, with a luminous endpoint. -->
    <path d="M414 137 L603 500 L314 500" fill="none" stroke="#ffe9a0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)"/>
    <circle cx="314" cy="500" r="12" fill="#ffe9a0" filter="url(#goldGlow)"/>
    <circle cx="603" cy="500" r="7" fill="#9bb7ff"/>

    <!-- Green ring + yellow core: visual proxy for the hand-tracked index fingertip. -->
    <circle cx="414" cy="137" r="46" fill="#5dff9a" opacity=".18" filter="url(#softGlow)"/>
    <circle cx="414" cy="137" r="28" fill="none" stroke="#5dff9a" stroke-width="7"/>
    <circle cx="414" cy="137" r="13" fill="#ffe9a0"/>
    <circle cx="409" cy="132" r="5" fill="#fff8e0"/>

    <!-- Simplified open spread, kept clear below the drawing plane. -->
    <g transform="translate(184 465)">
      <path d="M0 28Q95 0 195 22v119Q96 119 0 151Z" fill="#e8d6a8" fill-opacity=".94" stroke="#e8c76a" stroke-width="3"/>
      <path d="M195 22Q295 0 390 28v123q-95-32-195-10Z" fill="#e8d6a8" fill-opacity=".94" stroke="#e8c76a" stroke-width="3"/>
      <path d="M195 22v119" stroke="#8f6a38" stroke-width="5"/>
      <text x="72" y="78" text-anchor="middle" class="display" font-size="15" fill="#563a25">APPRENTICE</text>
      <text x="72" y="99" text-anchor="middle" class="display" font-size="15" fill="#563a25">NOTES</text>
      <path d="M242 68h90M242 88h72M242 108h82" stroke="#8f6a38" stroke-width="4" stroke-linecap="round" opacity=".7"/>
    </g>
  </g>

  <g transform="translate(56 930)">
    <rect width="682" height="94" rx="20" fill="url(#panel)" stroke="#e8c76a" stroke-opacity=".4"/>
    <circle cx="38" cy="47" r="14" fill="none" stroke="#5dff9a" stroke-width="5"/><circle cx="38" cy="47" r="7" fill="#ffe9a0"/><text x="60" y="52" class="body">Tracked fingertip</text>
    <path d="M249 47h54" stroke="#9bb7ff" stroke-width="7" stroke-linecap="round" stroke-dasharray="12 12"/><text x="319" y="52" class="body">Guide path</text>
    <path d="M457 47h54" stroke="#ffe9a0" stroke-width="7" stroke-linecap="round"/><text x="527" y="52" class="body">Your trace</text>
  </g>
  <text x="56" y="1060" class="small">Use a green ring with a yellow core for hand tracking; never reuse either colour for an error state.</text>
  <text x="56" y="1092" class="small">Page 3 of 3 · Journey To Be A Great Mage mid-fidelity demo</text>
</svg>
