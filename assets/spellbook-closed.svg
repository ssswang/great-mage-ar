<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 720" role="img" aria-label="Ancient leather spellbook">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7a4932"/><stop offset=".34" stop-color="#48231d"/><stop offset=".76" stop-color="#24100f"/><stop offset="1" stop-color="#100709"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f1d797"/><stop offset=".52" stop-color="#c6a263"/><stop offset="1" stop-color="#8f683b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-15%" width="150%" height="150%"><feDropShadow dx="12" dy="16" stdDeviation="12" flood-color="#050205" flood-opacity=".62"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- visible page block and dark back board give the asset real book depth -->
  <g filter="url(#shadow)">
    <path d="M91 82 L442 111 L455 620 L119 663 Z" fill="#12090a"/>
    <path d="M77 98 L423 125 L441 630 L105 671 Z" fill="url(#pages)" stroke="#5c3b21" stroke-width="8"/>
    <g opacity=".44" stroke="#76502d" stroke-width="3">
      <path d="M91 139L431 164M94 158L432 183M96 177L433 202M98 196L434 221M100 215L435 240M102 234L436 259M104 253L437 278M106 272L438 297M108 291L439 316M110 310L440 335M112 329L440 354M114 348L440 373M116 367L440 392M118 386L441 411M120 405L441 430M122 424L441 449M124 443L441 468M126 462L441 487M128 481L441 506M130 500L441 525M132 519L441 544M134 538L441 563M136 557L441 582"/>
    </g>
    <path d="M52 55 L394 82 L421 592 L82 650 Z" fill="url(#cover)" stroke="#1b0b0c" stroke-width="18" stroke-linejoin="round"/>
    <path d="M57 58 L393 85 L418 590 L84 645" fill="none" stroke="#bd8d41" stroke-width="5" opacity=".9"/>
    <path d="M83 91 L361 113 L383 556 L112 602 Z" fill="none" stroke="#9d6a34" stroke-width="4" opacity=".7"/>
    <!-- ribbed spine -->
    <path d="M52 55 L92 59 L122 646 L82 650 Z" fill="#2d1212" stroke="#a36d35" stroke-width="3"/>
    <g fill="none" stroke="#81502c" stroke-width="8" opacity=".9"><path d="M64 132L103 135M66 230L108 233M71 338L113 341M75 448L117 451M79 555L121 558"/></g>
    <!-- worn leather creases -->
    <g fill="none" stroke="#b3714b" stroke-width="3" opacity=".18"><path d="M153 217C210 197 276 211 338 195M148 237C218 221 286 235 350 221M168 467C225 454 292 469 352 451M155 494C222 479 295 494 364 475"/></g>
    <!-- brass corners -->
    <g fill="#754a20" stroke="#d1a14f" stroke-width="4"><path d="M54 55h50v14c-20 5-32 17-37 39H53z"/><path d="M393 82h-43v14c19 5 29 18 34 39h25z"/><path d="M82 650h48v-15c-18-5-29-17-35-39H80z"/><path d="M421 592h-42v15c18 5 28 17 33 38h25z"/></g>
    <!-- central clasp seal -->
    <g transform="translate(235 350) rotate(4)" filter="url(#glow)"><circle r="55" fill="#24100e" stroke="#c9903b" stroke-width="7"/><circle r="41" fill="none" stroke="#75431f" stroke-width="3"/><path d="M0-27L24 0 0 27 -24 0Z" fill="none" stroke="#e07632" stroke-width="5"/><circle r="5" fill="#f6c366"/></g>
  </g>
</svg>
